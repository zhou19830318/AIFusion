<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>AI Fusion</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #0b0b0e;
        color: #f5f5f7;
        font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }

      #loading {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        text-align: center;
        padding: 20px;
      }

      .logo {
        width: 64px;
        height: 64px;
        animation: breathe 2.4s ease-in-out infinite;
        filter: drop-shadow(0 4px 10px rgba(0,0,0,0.5));
      }
      @keyframes breathe {
        0%, 100% { opacity: 0.55; transform: scale(0.96); }
        50%      { opacity: 1;    transform: scale(1); }
      }
      @media (prefers-reduced-motion: reduce) {
        .logo { animation: none; opacity: 0.8; }
      }

      #status-text {
        font-size: 13px;
        color: #9898a8;
      }

      #error-text {
        display: none;
        font-size: 12px;
        color: #e0556a;
        max-width: 280px;
        line-height: 1.5;
      }
      #error-text a {
        color: #fc7ab1;
        text-decoration: underline;
        cursor: pointer;
      }

      .spinner {
        width: 20px;
        height: 20px;
        border: 2px solid #2a2a34;
        border-top-color: #c12d9c;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="loading">
      <svg class="logo" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg" aria-label="AI Fusion">
        <path d="M24 3L43 13.5V34.5L24 45L5 34.5V13.5L24 3Z" fill="#241031" stroke="#4a1d4a" stroke-width="1.5" stroke-linejoin="round"/>
        <path d="M24 24L5 13.5L5 34.5L24 45V24Z" fill="#7c1a6b"/>
        <path d="M24 24L43 13.5V34.5L24 45V24Z" fill="#c12d9c"/>
        <path d="M24 3L5 13.5L24 24L43 13.5L24 3Z" fill="#fc7ab1"/>
        <path d="M24 24V45" stroke="#2b0c26" stroke-width="1.4"/>
        <path d="M5 13.5L24 24L43 13.5" stroke="#e268c6" stroke-width="1.2" fill="none" opacity="0.85"/>
      </svg>
      <div class="spinner"></div>
      <div id="status-text">Connecting to AI Fusion server…</div>
      <div id="error-text">
        <p>Could not connect to the AI Fusion server.</p>
        <p>Make sure the add-in is running and Fusion is not in a disconnected state.</p>
        <p><a onclick="location.reload()">Click here to retry</a></p>
      </div>
    </div>

    <script>
      // Retry connecting to the chat server until it's ready.
      // If the server is not ready yet when the palette first opens,
      // this prevents the browser's "ERR_CONNECTION_REFUSED" page
      // from appearing — instead we show a friendly loading state.
      //
      // Override the target via localStorage from the palette web inspector:
      //   localStorage.setItem("aifusion.chatUrl", "http://127.0.0.1:3001/chat");
      //   location.reload();

      (function() {
        const FALLBACK = "http://127.0.0.1:8765/chat";
        const target =
          (window.localStorage && window.localStorage.getItem("aifusion.chatUrl")) ||
          FALLBACK;

        // Extract host + port from the target URL
        function getOrigin(url) {
          try {
            var u = new URL(url);
            return u.origin;
          } catch(e) {
            // Fallback for very old browsers
            var m = url.match(/^https?:\/\/([^\/]+)/);
            return m ? m[1] : "http://127.0.0.1:8765";
          }
        }

        var origin = getOrigin(target);
        var statusEl = document.getElementById("status-text");
        var errorEl = document.getElementById("error-text");
        var spinnerEl = document.querySelector(".spinner");
        var retries = 0;
        var MAX_RETRIES = 30;  // ~30 seconds

        function tryConnect() {
          retries++;
          statusEl.textContent = "Connecting to AI Fusion server… (" + retries + "/" + MAX_RETRIES + ")";

          var xhr = new XMLHttpRequest();
          xhr.open("GET", origin + "/chat", true);
          xhr.timeout = 2000;

          xhr.onload = function() {
            if (xhr.status >= 200 && xhr.status < 400) {
              // Server is ready — redirect to chat UI
              statusEl.textContent = "Connected! Loading…";
              location.replace(target);
            } else {
              scheduleRetry();
            }
          };

          xhr.onerror = function() {
            scheduleRetry();
          };

          xhr.ontimeout = function() {
            scheduleRetry();
          };

          xhr.send();
        }

        function scheduleRetry() {
          if (retries >= MAX_RETRIES) {
            // Give up — show error
            if (spinnerEl) spinnerEl.style.display = "none";
            statusEl.textContent = "Could not connect";
            errorEl.style.display = "block";
            return;
          }
          setTimeout(tryConnect, 1000);
        }

        // Start trying
        tryConnect();
      })();
    </script>
  </body>
</html>
