<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AI Fusion — Multi-Provider</title>
<style>
  /* ===== dark theme ===== */
  :root {
    --bg: #0b0b0e;
    --surface: #16161a;
    --surface2: #1e1e24;
    --border: #2a2a34;
    --text: #e4e4ec;
    --text2: #9898a8;
    --accent: #c12d9c;
    --accent2: #fc7ab1;
    --user-bubble: #2a1a3a;
    --tool-bg: #12121a;
    --tool-border: #2a2a3a;
    --error: #e0556a;
    --success: #4caf93;
    --radius: 10px;
    --mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
    --header-h: 44px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
    font-size: 13px;
    line-height: 1.5;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  #app { display: flex; flex-direction: column; height: 100%; position: relative; }

  #header {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 12px; background: var(--surface);
    border-bottom: 1px solid var(--border); flex-shrink: 0;
  }
  #header .logo { width: 26px; height: 26px; flex-shrink: 0; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.45)); }
  #header .title { font-weight: 600; font-size: 13px; }
  #header .badge {
    margin-left: auto; font-size: 10px; padding: 2px 8px;
    border-radius: 99px; background: var(--surface2);
    color: var(--text2); cursor: pointer;
    border: 1px solid var(--border); white-space: nowrap;
  }
  #header .badge:hover { background: var(--border); }
  #header .badge.configured { color: var(--success); border-color: var(--success); }
  #history-btn, #clear-btn { background: transparent; color: var(--text2); border: 1px solid var(--border); border-radius: 6px; padding: 3px 7px; cursor: pointer; font-size: 11px; }
  #history-btn:hover, #clear-btn:hover { color: var(--text); border-color: var(--accent); }

  #messages {
    flex: 1; overflow-y: auto; padding: 12px;
    display: flex; flex-direction: column; gap: 10px;
  }
  .msg { max-width: 100%; animation: msgIn 0.15s ease-out; }
  @keyframes msgIn {
    from { opacity: 0; transform: translateY(4px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .msg.user { align-self: flex-end; max-width: 88%; }
  .msg.user .bubble {
    background: var(--user-bubble); border: 1px solid #3a2050;
    border-radius: var(--radius) var(--radius) 2px var(--radius);
    padding: 8px 12px; color: #e8d0f8;
  }

  .msg.assistant { align-self: flex-start; max-width: 92%; }
  .msg.assistant .bubble {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius) var(--radius) var(--radius) 2px;
    padding: 10px 12px; white-space: pre-wrap; word-break: break-word;
  }
  .msg.assistant .bubble p { margin: 0 0 6px; }
  .msg.assistant .bubble p:last-child { margin-bottom: 0; }
  .msg.assistant .bubble h2, .msg.assistant .bubble h3, .msg.assistant .bubble h4 { font-size: 13px; margin: 8px 0 4px; color: var(--accent2); }
  .msg.assistant .bubble ul, .msg.assistant .bubble ol { margin: 2px 0 6px 18px; }
  .msg.assistant .bubble li { margin: 1px 0; }
  .msg.assistant .bubble code { background: var(--surface2); padding: 1px 5px; border-radius: 3px; font-size: 12px; }
  .msg.assistant .bubble pre { background: var(--surface2); padding: 8px; border-radius: 6px; overflow-x: auto; font-size: 11px; margin: 6px 0; }

  .tool-call {
    align-self: flex-start; max-width: 96%;
    background: var(--tool-bg); border: 1px solid var(--tool-border);
    border-radius: var(--radius); font-size: 12px; overflow: hidden;
  }
  .tool-call.is-error { border-color: #4a2030; }
  .tool-call > summary {
    list-style: none; display: flex; align-items: center; gap: 7px;
    padding: 7px 10px; cursor: pointer; user-select: none;
  }
  .tool-call > summary::-webkit-details-marker { display: none; }
  .tool-call > summary:hover { background: var(--surface2); }
  .tool-call .tool-status { flex-shrink: 0; width: 14px; text-align: center; font-size: 11px; font-weight: 700; }
  .tool-call.is-ok .tool-status { color: var(--success); }
  .tool-call.is-error .tool-status { color: var(--error); }
  .tool-call .tool-name { font-weight: 600; color: var(--accent2); font-family: var(--mono); font-size: 11.5px; flex-shrink: 0; }
  .tool-call .tool-summary { color: var(--text2); font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0; }
  .tool-call .tool-meta { flex-shrink: 0; color: var(--text2); font-size: 10px; opacity: 0.85; font-family: var(--mono); }
  .tool-call .chev { flex-shrink: 0; color: var(--text2); font-size: 9px; transition: transform 0.15s; }
  .tool-call[open] .chev { transform: rotate(90deg); }
  .tool-call .tool-body { padding: 0 10px 9px; border-top: 1px solid var(--tool-border); }
  .tool-call .tool-section-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text2); margin: 8px 0 3px; }
  .tool-call .result-head { display: flex; align-items: center; justify-content: space-between; margin-top: 8px; }
  .tool-call .result-head .tool-section-label { margin: 0; }
  .tool-call pre {
    margin: 0; padding: 6px 8px; background: var(--surface); border: 1px solid var(--border);
    border-radius: 6px; font-size: 11px; line-height: 1.45; font-family: var(--mono);
    max-height: 220px; overflow: auto; white-space: pre-wrap; word-break: break-all; color: var(--text2);
  }
  .tool-call pre.script { white-space: pre; color: var(--text); }
  .tool-call.is-error .result-pre { color: var(--error); border-color: #4a2030; }
  .tool-call .j-key { color: #7fb3ff; }
  .tool-call .j-str { color: #a8d8a8; }
  .tool-call .j-num { color: #f0c674; }
  .tool-call .copy-btn { background: transparent; border: 1px solid var(--border); color: var(--text2); border-radius: 4px; font-size: 10px; padding: 1px 6px; cursor: pointer; }
  .tool-call .copy-btn:hover { color: var(--text); border-color: var(--accent); }

  #input-area { flex-shrink: 0; padding: 8px 10px; background: var(--surface); border-top: 1px solid var(--border); }
  #input-area form { display: flex; flex-direction: column; gap: 2px; }
  .input-row { display: flex; gap: 6px; align-items: flex-end; }
  #prompt {
    flex: 1; background: var(--surface2); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 8px 12px; color: var(--text);
    font-size: 13px; font-family: inherit; resize: none; outline: none;
    min-height: 36px; max-height: 120px; line-height: 1.4;
  }
  #prompt:focus { border-color: var(--accent); }
  #send-btn {
    flex-shrink: 0; width: 36px; height: 36px; border: none;
    border-radius: var(--radius); background: var(--accent); color: #fff;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: background 0.15s;
  }
  #send-btn svg { width: 17px; height: 17px; pointer-events: none; }
  #send-btn:hover { background: var(--accent2); }
  #send-btn:hover svg { transform: translate(1px, -1px); }
  #send-btn svg { transition: transform 0.15s; }
  #send-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  #status { display: none; align-items: center; justify-content: center; gap: 8px; padding: 5px 12px; background: #1a1020; border-top: 1px solid #3a2050; font-size: 11px; color: var(--text2); flex-shrink: 0; }
  #status.visible { display: flex; }
  #status .spinner { width: 12px; height: 12px; flex-shrink: 0; border: 2px solid var(--border); border-top-color: var(--accent2); border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  #scroll-btn {
    position: absolute; right: 14px; bottom: 78px; z-index: 6;
    width: 30px; height: 30px; border-radius: 50%;
    background: var(--surface2); color: var(--text2);
    border: 1px solid var(--border); cursor: pointer; display: none;
    align-items: center; justify-content: center; font-size: 14px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.4);
  }
  #scroll-btn:hover { color: var(--text); border-color: var(--accent); }
  #scroll-btn.visible { display: flex; }

  .thinking-line { color: var(--text2); font-size: 11px; font-style: italic; padding: 2px 0; animation: msgIn 0.15s ease-out; }
  .muted-note { color: var(--text2); }
  .vision-note { color: var(--text2); font-size: 11px; font-style: italic; }

  /* ── Settings overlay ── */
  #settings {
    display: none; position: absolute; top: var(--header-h); bottom: 0; left: 0; right: 0;
    background: var(--bg); z-index: 10; overflow-y: auto; padding: 16px;
    flex-direction: column; gap: 10px;
  }
  #settings.open { display: flex; }
  #history-panel { display: none; position: absolute; top: var(--header-h); bottom: 0; left: 0; right: 0; background: var(--bg); z-index: 9; overflow-y: auto; padding: 16px; }
  #history-panel.open { display: block; }
  .history-row { display: flex; gap: 6px; margin: 8px 0; }
  .history-row select, .history-row input { flex: 1; min-width: 0; background: var(--surface2); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 7px; }
  .history-btn { background: var(--surface2); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 7px 9px; cursor: pointer; }
  .history-btn.primary { background: var(--accent); border-color: var(--accent); color: white; }
  #history-status { color: var(--text2); font-size: 11px; margin-top: 10px; }
  #settings label {
    font-size: 11px; color: var(--text2); text-transform: uppercase;
    letter-spacing: 0.5px; margin-bottom: -6px;
  }
  #settings select, #settings input, #settings textarea {
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 6px; padding: 8px 10px; color: var(--text);
    font-size: 13px; font-family: inherit; width: 100%;
  }
  #settings textarea { min-height: 80px; resize: vertical; font-size: 12px; }
  #settings .btn-row { display: flex; gap: 8px; margin-top: 4px; }
  #settings .btn {
    flex: 1; padding: 8px; border: none; border-radius: 6px;
    font-size: 13px; cursor: pointer; font-weight: 600;
  }
  #settings .btn.save { background: var(--accent); color: #fff; }
  #settings .btn.save:hover { background: var(--accent2); }
  #settings .btn.cancel { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }

  /* Provider info row */
  #settings .info-row {
    display: flex; align-items: center; gap: 6px; font-size: 11px;
  }
  #settings .info-row .dot {
    width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
  }
  #settings .info-row .dot.ok { background: var(--success); }
  #settings .info-row .dot.missing { background: var(--error); }

  .empty-state {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    height: 100%; color: var(--text2); text-align: center; gap: 8px; padding: 20px;
  }
  .empty-state h2 { font-size: 15px; font-weight: 600; color: var(--text); }
  .empty-state p { font-size: 12px; max-width: 300px; }
  .empty-state .examples { display: flex; flex-direction: column; gap: 6px; margin-top: 12px; width: 100%; max-width: 320px; }
  .empty-state .example { background: var(--surface); border: 1px solid var(--border); color: var(--text2); border-radius: 8px; padding: 7px 10px; font-size: 12px; cursor: pointer; text-align: left; transition: border-color 0.15s, color 0.15s; }
  .empty-state .example:hover { border-color: var(--accent); color: var(--text); }

  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  /* ── Attachments ── */
  .attach-btn { position: relative; flex-shrink: 0; width: 36px; height: 36px; background: var(--surface2); color: var(--text2); border: 1px solid var(--border); border-radius: var(--radius); font-size: 15px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .attach-btn svg { width: 17px; height: 17px; pointer-events: none; transition: color 0.15s, transform 0.15s; }
  .attach-btn:hover { border-color: var(--accent); color: var(--accent2); }
  .attach-btn:hover svg { transform: rotate(-8deg); }
  .attach-count { position: absolute; top: -5px; right: -5px; min-width: 15px; height: 15px; border-radius: 99px; background: var(--accent); color: #fff; font-size: 9px; line-height: 15px; text-align: center; padding: 0 3px; display: none; }
  .attach-count.visible { display: block; }
  .attach-preview { display: flex; flex-wrap: wrap; gap: 6px; }
  .attach-preview:not(:empty) { padding: 2px 2px 6px; }
  .attach-chip { display: flex; align-items: center; gap: 6px; background: var(--panel2, #2a2f3a); border: 1px solid var(--border); border-radius: 8px; padding: 4px 6px; max-width: 200px; }
  .attach-chip img { width: 28px; height: 28px; object-fit: cover; border-radius: 4px; background: #fff; }
  .attach-chip .file-ic { font-size: 18px; }
  .attach-chip .name { font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .attach-chip .rm { cursor: pointer; font-size: 12px; color: var(--text2); border: 0; background: transparent; padding: 0 2px; }
  .attach-chip .rm:hover { color: var(--error, #e5484d); }
  .badge-attach { display: inline-block; background: var(--panel2, #2a2f3a); border: 1px solid var(--border); border-radius: 6px; font-size: 11px; padding: 1px 6px; margin-right: 6px; }
</style>
</head>
<body>
<div id="app">
  <!-- Header -->
  <div id="header">
    <svg class="logo" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg" aria-label="AI Fusion">
      <path d="M24 3L43 13.5V34.5L24 45L5 34.5V13.5L24 3Z" fill="#241031" stroke="#4a1d4a" stroke-width="1.5" stroke-linejoin="round"/>
      <path d="M24 24L5 13.5L5 34.5L24 45V24Z" fill="#7c1a6b"/>
      <path d="M24 24L43 13.5V34.5L24 45V24Z" fill="#c12d9c"/>
      <path d="M24 3L5 13.5L24 24L43 13.5L24 3Z" fill="#fc7ab1"/>
      <path d="M24 24V45" stroke="#2b0c26" stroke-width="1.4"/>
      <path d="M5 13.5L24 24L43 13.5" stroke="#e268c6" stroke-width="1.2" fill="none" opacity="0.85"/>
    </svg>
    <span class="title">AI Fusion</span>
    <button id="history-btn" title="项目历史与会话恢复">历史</button>
    <button id="clear-btn" title="清空当前会话对话">清空</button>
    <span id="model-badge" class="badge" title="Open settings">⚙ deepseek</span>
  </div>

  <div id="history-panel">
    <h3>项目历史</h3>
    <p style="color:var(--text2);font-size:11px;margin-top:4px">对话、工具调用和结果会保存在本机。图片内容和 API Key 不会写入历史。</p>
    <div class="history-row">
      <select id="history-project"></select>
      <button class="history-btn primary" id="history-new-project">新建项目</button>
    </div>
    <div class="history-row">
      <select id="history-session"></select>
      <button class="history-btn" id="history-new-session">新建会话</button>
      <button class="history-btn" id="history-restore">恢复</button>
    </div>
    <div id="history-status">正在加载历史…</div>
  </div>

  <div id="messages">
    <div class="empty-state" id="empty-state">
      <h2>AI Fusion — Multi-Provider</h2>
      <p>6 providers supported: DeepSeek · Kimi · GLM · OpenAI · Claude · Gemini</p>
      <div class="examples">
        <button type="button" class="example">建模：一个 80×60×30 mm 的外壳，正面留 USB 和 BOOT 开孔</button>
        <button type="button" class="example">修改：把所有圆角半径改成 3mm，并加 2mm 壁厚</button>
        <button type="button" class="example">查询：列出当前设计所有实体的尺寸和体积</button>
      </div>
    </div>
  </div>

  <button id="scroll-btn" title="回到底部">↓</button>

  <div id="status"><span class="spinner"></span><span id="status-text">Thinking...</span></div>

  <div id="input-area">
    <form id="chat-form" autocomplete="off">
      <div id="attach-preview" class="attach-preview"></div>
      <div class="input-row">
        <button type="button" id="attach-btn" class="attach-btn" title="添加附件（图片或 PDF，单张 ≤8MB，最多 4 个）"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg><span id="attach-count" class="attach-count"></span></button>
        <textarea id="prompt" rows="1" placeholder="描述你想做的设计..." spellcheck="false"></textarea>
        <button id="send-btn" type="submit" title="Send (Enter)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"/>
            <polygon points="22 2 15 22 11 13 2 9 22 2"/>
          </svg>
        </button>
      </div>
      <input type="file" id="attach-input" accept="image/*,.pdf" multiple hidden />
    </form>
  </div>

  <!-- ── Settings overlay (dynamic per provider) ── -->
  <div id="settings">
    <label>Provider</label>
    <select id="cfg-provider">
      <option value="deepseek">DeepSeek</option>
      <option value="kimi">Kimi (Moonshot)</option>
      <option value="zhipu">Zhipu GLM</option>
      <option value="openai">OpenAI</option>
      <option value="anthropic">Anthropic Claude</option>
      <option value="google_gemini">Google Gemini</option>
    </select>

    <div id="cfg-info" class="info-row"></div>

    <label>Model</label>
    <select id="cfg-model"></select>

    <label id="cfg-apikey-label">API Key</label>
    <input type="password" id="cfg-apikey" placeholder="sk-..." />

    <label>Base URL</label>
    <input type="text" id="cfg-baseurl" placeholder="https://..." />

    <label>
      <input type="checkbox" id="cfg-vision-check" checked />
      设计完成后自动截图视觉校验
    </label>

    <label>System Prompt</label>
    <textarea id="cfg-system-prompt" placeholder="System instructions for the AI..." rows="4"></textarea>

    <div class="btn-row">
      <button class="btn cancel" id="settings-cancel">Cancel</button>
      <button class="btn save" id="settings-save">Save</button>
    </div>
  </div>
</div>

<script>
// ============================================================================
// AI Fusion — Multi-Provider Chat UI
//
// Key features:
//  - Dynamic provider switching (6 providers)
//  - Per-provider model list, API key field, base URL
//  - Backward compatible with the existing /api/chat and /api/config endpoints
// ============================================================================

(function () {
  "use strict";

  // ── DOM refs ──
  const messagesEl   = document.getElementById("messages");
  const emptyState   = document.getElementById("empty-state");
  const statusEl     = document.getElementById("status");
  const promptEl     = document.getElementById("prompt");
  const formEl       = document.getElementById("chat-form");
  const sendBtn      = document.getElementById("send-btn");
  const modelBadge   = document.getElementById("model-badge");
  const settingsEl   = document.getElementById("settings");

  // ── State ──
  let conversation = [];
  let isProcessing = false;
  let providersMeta = {};  // fetched from /api/models
  let attachments = [];    // {name, mime, dataUrl, size}
  let historyProject = null;
  let historySession = null;
  let historyProjects = [];
  const ATTACH_MAX = 4;
  const ATTACH_MAX_BYTES = 8 * 1024 * 1024;

  function historyState() {
    return { conversation, provider: modelBadge.dataset.active || "", saved_at: new Date().toISOString() };
  }

  // CAD reads such as bodies/timeline can be much larger than the provider's
  // context budget. Keep the full result visible in the Palette, but send a
  // bounded, useful observation back to the model.
  const MODEL_TOOL_RESULT_LIMIT = 18000;
  const MODEL_CONTEXT_LIMIT = 105000;
  function compactModelText(value, limit = MODEL_TOOL_RESULT_LIMIT) {
    const text = typeof value === "string" ? value : JSON.stringify(value);
    if (!text || text.length <= limit) return text || "";
    const head = Math.floor(limit * 0.72);
    const tail = limit - head;
    return `${text.slice(0, head)}\n...[tool result truncated for model context: ${text.length} chars]...\n${text.slice(-tail)}`;
  }
  function modelConversation() {
    const [curProv, curModel] = modelBadge.dataset.active ? modelBadge.dataset.active.split("/") : [null, null];
    const canSee = modelSupportsVision(curProv, curModel);
    const copy = conversation.map((msg) => {
      if (msg.role === "tool") return {...msg, content: compactModelText(msg.content)};
      if (msg.role === "assistant" && msg.tool_calls) {
        return {...msg, content: compactModelText(msg.content || "", 6000)};
      }
      if (msg._vision && !canSee) {
        // 截图只发给支持视觉的模型;纯文本模型仅保留提示,避免无效大 payload
        const { _vision, ...rest } = msg;
        return {...rest, content: "（视觉校验截图未发送：当前模型不支持图片输入）"};
      }
      return msg;
    });
    let total = copy.reduce((n, m) => n + (typeof m.content === "string" ? m.content.length : JSON.stringify(m.content || "").length), 0);
    if (total > MODEL_CONTEXT_LIMIT) {
      // Compress oldest tool observations first; preserve user requests and
      // the newest tool result because it is most relevant to repair.
      for (const msg of copy) {
        if (total <= MODEL_CONTEXT_LIMIT) break;
        if (msg.role !== "tool" || typeof msg.content !== "string" || msg.content.length <= 1200) continue;
        const before = msg.content.length;
        msg.content = compactModelText(msg.content, 1200);
        total -= before - msg.content.length;
      }
    }
    return copy;
  }

  async function saveHistoryEvent(eventType, payload) {
    if (!historySession) return;
    try {
      await apiCall("POST", `/api/sessions/${historySession.id}/events`, {
        event_type: eventType, payload: payload || {}, state: historyState()
      });
      const status = document.getElementById("history-status");
      if (status) status.textContent = `已保存 · ${new Date().toLocaleTimeString()}`;
    } catch (err) {
      console.warn("[aifusion] history save failed", err);
      const status = document.getElementById("history-status");
      if (status) status.textContent = `历史保存失败：${err.message}`;
    }
  }

  function renderHistorySelectors() {
    const psel = document.getElementById("history-project");
    const ssel = document.getElementById("history-session");
    if (!psel || !ssel) return;
    psel.innerHTML = historyProjects.map(p => `<option value="${escapeHtml(p.id)}">${escapeHtml(p.name)}</option>`).join("");
    if (historyProject) psel.value = historyProject.id;
    ssel.innerHTML = historyProject?.sessions?.map(s => `<option value="${escapeHtml(s.id)}">${escapeHtml(s.title)} · ${new Date(s.updated_at).toLocaleString()}</option>`).join("") || "";
    if (historySession) ssel.value = historySession.id;
  }

  async function refreshHistory() {
    const status = document.getElementById("history-status");
    try {
      const data = await apiCall("GET", "/api/projects");
      historyProjects = data.projects || [];
      if (!historyProjects.length) {
        const created = await apiCall("POST", "/api/projects", {name: "Fusion design"});
        historyProjects = [created.project];
      }
      for (const project of historyProjects) {
        project.sessions = (await apiCall("GET", `/api/projects/${project.id}/sessions`)).sessions || [];
      }
      historyProject = historyProjects[0];
      historySession = historyProject.sessions[0] || (await apiCall("POST", `/api/projects/${historyProject.id}/sessions`, {title: "Main design session"})).session;
      if (!historyProject.sessions.length) historyProject.sessions = [historySession];
      renderHistorySelectors();
      if (status) status.textContent = "历史已就绪";
      await restoreHistory(false);
    } catch (err) {
      if (status) status.textContent = `历史不可用：${err.message}`;
    }
  }

  async function restoreHistory(showMessage = true) {
    if (!historySession) return;
    const data = await apiCall("GET", `/api/sessions/${historySession.id}`);
    const state = data.session?.state || {};
    conversation = Array.isArray(state.conversation) ? state.conversation : [];
    messagesEl.querySelectorAll(".msg, .tool-call, .thinking-line").forEach(el => el.remove());
    if (emptyState) emptyState.style.display = conversation.length ? "none" : "";
    for (const msg of conversation) {
      if (msg.role === "user") addMessageEl("user", renderMarkdown(typeof msg.content === "string" ? msg.content : "(已恢复的多模态消息)"));
      else if (msg.role === "assistant" && msg.content) addMessageEl("assistant", renderMarkdown(msg.content));
    }
    if (showMessage) addMessageEl("assistant", `<span class="muted-note">已恢复会话：${escapeHtml(data.session.title)}</span>`);
  }

  // ── Vision check (screenshot → multimodal verification) ──
  const VISION_MAX_ROUNDS = 3;
  const VISION_CHECK_PROMPT = `你拿到的是 Fusion 当前设计的视口截图，请进行视觉粗校验。对照用户最初的设计要求和你此前给出的 CAD BRIEF（尺寸、特征、外观），检查：
1. 几何形态与预期是否一致（有无多余或缺失的特征，比例是否明显失调）；
2. 实体是否完整、位置是否正确；
3. 是否需要修复优化。

结论必须二选一：
- 基本符合预期 → 直接输出最终总结（包含尺寸、特征清单、验证结果）；
- 不符合 → 说明具体问题，继续用 execute 工具修复模型（修复后模型会再次截图校验，最多 ${VISION_MAX_ROUNDS} 轮）。

只依据截图与已执行的建模记录判断，不要凭空猜测尺寸。`;

  // ── API ──
  const API_BASE = window.location.origin;

  async function apiCall(method, path, body) {
    const opts = { method, headers: { "Content-Type": "application/json" } };
    if (body) opts.body = JSON.stringify(body);
    const resp = await fetch(API_BASE + path, opts);
    const contentType = resp.headers.get("content-type") || "";
    if (!contentType.toLowerCase().includes("application/json")) {
      const raw = await resp.text();
      if (/<html|<!doctype/i.test(raw)) {
        throw new Error(`本地服务未加载最新接口（${path}）。请重启 AIFusion 插件后重试。`);
      }
      throw new Error(`接口返回了非 JSON 响应（HTTP ${resp.status}，${path}）`);
    }
    let data;
    try {
      data = await resp.json();
    } catch {
      throw new Error(`接口 JSON 无法解析（HTTP ${resp.status}，${path}）`);
    }
    if (!resp.ok) {
      const detail = data.error && typeof data.error === "object" ? data.error.message : data.error;
      const err = new Error(detail || `HTTP ${resp.status}`);
      err.code = data.error?.code;
      err.retryable = !!data.error?.retryable;
      err.requestId = data.error?.request_id;
      throw err;
    }
    return data;
  }

  // ── Vision helpers ──
  function modelSupportsVision(pid, model) {
    const pmeta = providersMeta[pid];
    if (!pmeta) return false;
    if (pmeta.vision_all) return true;
    return (pmeta.vision_models || []).includes(model);
  }
  function visionCheckEnabled() {
    const el = document.getElementById("cfg-vision-check");
    return !el || el.checked;
  }
  function isScreenshotResult(r) {
    return r && typeof r === "object" && !Array.isArray(r) &&
           r.type === "image" && typeof r.mimeType === "string" &&
           typeof r.data === "string" && r.data.length > 0;
  }
  // 截图 base64 → 画布降采样(最长边 ≤maxDim, JPEG quality),把 ~400KB 的
  // 视口截图压到 ~100-200KB,避免撑爆单次请求与模型上下文。
  function downscaleImageDataUrl(dataUrl, maxDim = 1024, quality = 0.72) {
    return new Promise((resolve) => {
      const img = new Image();
      img.onload = () => {
        try {
          const scale = Math.min(1, maxDim / Math.max(img.width, img.height));
          if (scale >= 1 || !img.width || !img.height) { resolve(dataUrl); return; }
          const canvas = document.createElement("canvas");
          canvas.width = Math.max(1, Math.round(img.width * scale));
          canvas.height = Math.max(1, Math.round(img.height * scale));
          const ctx = canvas.getContext("2d");
          if (!ctx) { resolve(dataUrl); return; }
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          resolve(canvas.toDataURL("image/jpeg", quality));
        } catch { resolve(dataUrl); }
      };
      img.onerror = () => resolve(dataUrl);
      img.src = dataUrl;
    });
  }
  function buildVisionCheckMessage(dataUrl) {
    return [
      { type: "text", text: VISION_CHECK_PROMPT },
      { type: "image_url", image_url: { url: dataUrl } },
    ];
  }
  function pushVisionCheckMessage(dataUrl) {
    // 只保留最近一张视觉校验截图:旧截图在下一轮修复后已过时,且会反复
    // 占用上下文/费用,必须替换而不是无限累积。
    conversation = conversation.filter(m => !m._vision);
    conversation.push({ role: "user", content: buildVisionCheckMessage(dataUrl), _vision: true });
  }

  // ── Attachments (user-provided images/PDFs as reference) ──
  function handleAttachFiles(fileList) {
    const files = Array.from(fileList || []);
    for (const f of files) {
      const isImg = /^image\/(png|jpe?g|webp|gif)$/i.test(f.type);
      const isPdf = f.type === "application/pdf" || /\.pdf$/i.test(f.name);
      if (!isImg && !isPdf) { alert(`附件 "${f.name}" 类型不支持（仅图片/PDF）`); continue; }
      if (f.size > ATTACH_MAX_BYTES) { alert(`附件 "${f.name}" 超过 8MB，已跳过`); continue; }
      if (attachments.length >= ATTACH_MAX) { alert(`附件最多 ${ATTACH_MAX} 个`); break; }
      const reader = new FileReader();
      reader.onload = async () => {
        // 大图先降采样再入队,否则 base64 会直接撑爆请求体/模型上下文
        let dataUrl = reader.result;
        if (isImg && f.size > 512 * 1024) {
          dataUrl = await downscaleImageDataUrl(dataUrl, 2048, 0.8);
        }
        attachments.push({ name: f.name, mime: isPdf ? "application/pdf" : f.type, dataUrl, size: f.size });
        renderAttachments();
      };
      reader.readAsDataURL(f);
    }
  }

  function renderAttachments() {
    const box = document.getElementById("attach-preview");
    const cnt = document.getElementById("attach-count");
    if (!box) return;
    box.innerHTML = "";
    attachments.forEach((a, i) => {
      const chip = document.createElement("div");
      chip.className = "attach-chip";
      const isImg = (a.mime || "").startsWith("image/");
      chip.innerHTML = `${isImg ? `<img src="${a.dataUrl}" alt="">` : '<span class="file-ic">📄</span>'}
        <span class="name" title="${escapeHtml(a.name)}">${escapeHtml(a.name)}</span>
        <button class="rm" title="移除">✕</button>`;
      chip.querySelector(".rm").onclick = () => { attachments.splice(i, 1); renderAttachments(); };
      box.appendChild(chip);
    });
    if (cnt) {
      cnt.textContent = attachments.length ? String(attachments.length) : "";
      cnt.classList.toggle("visible", attachments.length > 0);
    }
  }

  function clearAttachments() { attachments = []; renderAttachments(); }

  // 附件 → 发送给模型的 user content（OpenAI 多模态格式数组 / 纯文本）
  function buildUserMessageContent(userText) {
    if (!attachments.length) return userText;
    const [prov, model] = modelBadge.dataset.active ? modelBadge.dataset.active.split("/") : [null, null];
    if (!modelSupportsVision(prov, model)) {
      const names = attachments.map(a => a.name).join("、");
      return `${userText}\n\n[附件提示] 用户附带了 ${attachments.length} 个附件（${names}），但当前模型 ${model || "未知"} 不支持图片输入，附件内容未发送。如需让 AI 查看图片，请切换到支持视觉的模型（Kimi K3 / GPT-5.6 / Claude Sonnet 5 / Gemini 3.7 Flash）。`;
    }
    return [
      ...attachments.map(a => ({ type: "image_url", image_url: { url: a.dataUrl } })),
      { type: "text", text: userText },
    ];
  }

  function renderUserBubble(userText) {
    let html = escapeHtml(userText && userText.trim() ? userText : "(仅附件)");
    if (attachments.length) {
      const clipIcon = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:10px;height:10px;vertical-align:-1px;margin-right:3px"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>`;
      const chips = attachments.map(a => `<span class="badge-attach">${clipIcon}${escapeHtml(a.name)}</span>`).join("");
      html += `<br>${chips}`;
    }
    return html;
  }

  // ── Fusion bridge ──
  function callFusionTool(toolName, args) {
    return new Promise((resolve) => {
      function doCall() {
        try {
          // CRITICAL: The .pyc execute handler expects args in format:
          // {featureType: "script", object: {script: "def run..."}}
          // NOT {featureType: "script", script: "def run..."}
          let bridgeArgs = args;
          if (toolName === "execute" && args.featureType) {
            bridgeArgs = { featureType: args.featureType };
            if (args.featureType === "script") {
              bridgeArgs.object = { script: args.script || "" };
            } else if (args.featureType === "document") {
              bridgeArgs.object = { action: args.action || "" };
            } else if (args.featureType === "object") {
              bridgeArgs.object = { fileId: args.fileId || "" };
            }
          }
          const payload = JSON.stringify({ name: toolName, args: bridgeArgs });
          const result = adsk.fusionSendData("tool.call", payload);
          if (result && typeof result.then === "function") {
            result.then(data => { try { resolve(JSON.parse(data)); } catch { resolve({raw:data}); } })
                   .catch(err => resolve({error: err.message}));
          } else {
            try { resolve(JSON.parse(result)); } catch { resolve({raw: result}); }
          }
        } catch (e) { resolve({error: e.message}); }
      }

      if (typeof adsk !== "undefined" && adsk.fusionSendData) {
        doCall();
      } else {
        // wait up to 3s for adsk
        let waited = 0;
        function poll() {
          waited += 100;
          if (typeof adsk !== "undefined" && adsk.fusionSendData) { doCall(); }
          else if (waited >= 3000) {
          resolve({ok: false, error: {code: "fusion_unavailable", message: "Fusion bridge is unavailable; no CAD operation was executed."}});
          } else { setTimeout(poll, 100); }
        }
        setTimeout(poll, 50);
      }
    });
  }

  // A bridge response can be legacy-shaped. Normalize it before rendering or
  // sending it back to the model; payload.success=false is never a success.
  function normalizeToolResult(toolName, result) {
    if (result == null) return {ok: false, tool: toolName, error: {code: "empty_result", message: "Fusion returned no result."}};
    if (typeof result === "string") return {ok: false, tool: toolName, error: {code: "string_result", message: result}};
    if (result.error && !result.ok) return {...result, ok: false, tool: result.tool || toolName};
    const payload = Object.prototype.hasOwnProperty.call(result, "payload") ? result.payload : result;
    const success = payload && typeof payload === "object" && payload.success === false ? false : result.ok !== false;
    if (!success) {
      return {
        ...result, ok: false, tool: toolName,
        error: result.error || {code: "fusion_runtime", message: payload?.error || "Fusion operation failed."},
      };
    }
    return {...result, ok: true, tool: toolName, payload};
  }

  // ── Rendering ──
  // 智能滚动:默认吸底;用户向上滚动查看历史时不打扰,并显示"回到底部"按钮
  const scrollBtn = document.getElementById("scroll-btn");
  let stickToBottom = true;
  messagesEl.addEventListener("scroll", () => {
    const nearBottom = messagesEl.scrollHeight - messagesEl.scrollTop - messagesEl.clientHeight < 48;
    stickToBottom = nearBottom;
    if (scrollBtn) scrollBtn.classList.toggle("visible", !nearBottom);
  });
  if (scrollBtn) scrollBtn.addEventListener("click", () => { messagesEl.scrollTop = messagesEl.scrollHeight; });
  function scrollToBottom() { if (stickToBottom) messagesEl.scrollTop = messagesEl.scrollHeight; }
  function hideEmptyState() { if (emptyState) emptyState.style.display = "none"; }
  function setStatus(t) {
    const tx = document.getElementById("status-text");
    if (tx) tx.textContent = t;
    statusEl.classList.add("visible");
  }
  function clearStatus() { statusEl.classList.remove("visible"); }

  // ── Thinking 计时(任何等待状态都显示已耗时, 避免"看起来卡死")──
  let thinkBase = "";
  let thinkStart = 0;
  let thinkTimer = null;
  function setThinking(base) {
    clearThinkingTimer();
    thinkBase = base;
    thinkStart = Date.now();
    updateThinking();
    thinkTimer = setInterval(updateThinking, 5000);
  }
  function updateThinking() {
    const secs = ((Date.now() - thinkStart) / 1000) | 0;
    setStatus(`${thinkBase}… ${secs}s`);
  }
  function clearThinkingTimer() {
    if (thinkTimer) { clearInterval(thinkTimer); thinkTimer = null; }
  }
  function clearThinking() {
    clearThinkingTimer();
    thinkBase = "";
    thinkStart = 0;
    clearStatus();
  }
  function escapeHtml(s) {
    if (!s) return "";
    const d = document.createElement("div");
    d.appendChild(document.createTextNode(String(s)));
    return d.innerHTML;
  }

  function renderMarkdown(text) {
    if (!text) return "";
    let html = escapeHtml(text);
    html = html.replace(/```(\w*)\n?([\s\S]*?)```/g, (_, lang, code) => `<pre><code>${code.trim()}</code></pre>`);
    // 标题与列表:AI 总结常用 "## 验证结果" / "- 尺寸..." 格式,渲染成结构化 HTML
    html = html.replace(/^###\s+(.+)$/gm, "<h4>$1</h4>");
    html = html.replace(/^##\s+(.+)$/gm, "<h3>$1</h3>");
    html = html.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
    html = html.replace(/`([^`]+)`/g, "<code>$1</code>");
    // 连续的 "- item" 行包成 <ul>,内部去换行避免后插 <br>
    const lines = html.split("\n");
    const out = [];
    let inList = false;
    for (const line of lines) {
      const li = line.match(/^\s*[-*•]\s+(.*)/);
      if (li) {
        if (!inList) { out.push("<ul>"); inList = true; }
        out.push(`<li>${li[1]}</li>`);
      } else {
        if (inList) { out.push("</ul>"); inList = false; }
        out.push(line);
      }
    }
    if (inList) out.push("</ul>");
    html = out.join("\n");
    html = html.replace(/<ul>[\s\S]*?<\/ul>/g, m => m.replace(/\n/g, ""));
    html = html.split(/\n\n+/).map(p => `<p>${p.trim()}</p>`).join("");
    // 段落包裹器不应套住块级元素(h3/h4/ul/ol)
    html = html.replace(/<p>(<(?:h3|h4|ul|ol)[^>]*>)/g, "$1").replace(/(<\/(?:h3|h4|ul|ol)>)<\/p>/g, "$1");
    html = html.replace(/\n/g, "<br>");
    return html;
  }

  function addMessageEl(role, html) {
    hideEmptyState();
    const div = document.createElement("div");
    div.className = `msg ${role}`;
    div.innerHTML = `<div class="bubble">${html}</div>`;
    messagesEl.appendChild(div);
    scrollToBottom();
    return div;
  }

  function copyTextToClipboard(text, btn) {
    const done = () => { if (btn) { const old = btn.textContent; btn.textContent = "已复制"; setTimeout(() => { btn.textContent = old; }, 1200); } };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, done));
    } else { fallbackCopy(text, done); }
  }
  function fallbackCopy(text, done) {
    try {
      const ta = document.createElement("textarea");
      ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();
      document.execCommand("copy"); ta.remove(); done();
    } catch {}
  }

  // 工具调用一行摘要:让日志卡片收起时也能看懂这一步干了什么
  function summarizeToolCall(toolName, args, result) {
    try {
      if (toolName === "read") return String(args && args.queryType || "");
      if (toolName === "execute") {
        if (args && args.featureType === "script") {
          const lines = String(args.script || "").split("\n").map(s => s.trim());
          const meaningful = lines.find(s => s && !s.startsWith("#") && !/^def\s+run/.test(s));
          return meaningful ? meaningful.slice(0, 90) : "script";
        }
        return String((args && (args.action || args.fileId)) || "");
      }
      if (result && result.error) return String(result.error.message || result.error.code || "").slice(0, 90);
      return "";
    } catch { return ""; }
  }

  function highlightJson(jsonStr) {
    let s = escapeHtml(jsonStr);
    s = s.replace(/"([^"\\]+)"(\s*:)/g, '<span class="j-key">"$1"</span>$2');
    s = s.replace(/(:\s*)"([^"\\]*)"/g, '$1<span class="j-str">"$2"</span>');
    s = s.replace(/(:\s*)(-?\d+(?:\.\d+)?(?:[eE][+-]?\d+)?)(?=[,\n\r}]|$)/g, '$1<span class="j-num">$2</span>');
    return s;
  }

  function addToolCallEl(toolName, args, result, isError, startedAt) {
    hideEmptyState();
    const details = document.createElement("details");
    details.className = `tool-call ${isError ? "is-error" : "is-ok"}`;

    let argsText = "";
    try { argsText = JSON.stringify(args, null, 2); } catch { argsText = String(args); }
    const isScript = toolName === "execute" && args && args.featureType === "script" && typeof args.script === "string";

    let resultText = "";
    if (result && result._mock) resultText = String(result.message);
    else { try { resultText = JSON.stringify(result, null, 2); } catch { resultText = "(unprintable)"; } }

    const durMs = startedAt ? Date.now() - startedAt : 0;
    const durLabel = startedAt ? `${(durMs / 1000).toFixed(1)}s` : new Date().toLocaleTimeString();
    const summary = summarizeToolCall(toolName, args, result);

    details.innerHTML = `
      <summary>
        <span class="tool-status">${isError ? "✕" : "✓"}</span>
        <span class="tool-name">${escapeHtml(toolName)}</span>
        ${summary ? `<span class="tool-summary" title="${escapeHtml(summary)}">${escapeHtml(summary)}</span>` : "<span class=\"tool-summary\"></span>"}
        <span class="tool-meta">${escapeHtml(durLabel)}</span>
        <span class="chev">▶</span>
      </summary>
      <div class="tool-body">
        <div class="tool-section-label">Arguments</div>
        <pre class="${isScript ? "script" : "args-pre"}">${isScript ? escapeHtml(argsText) : highlightJson(argsText)}</pre>
        <div class="result-head">
          <span class="tool-section-label">Result</span>
          <button type="button" class="copy-btn">复制</button>
        </div>
        <pre class="result-pre ${isError ? "error" : ""}">${isError ? escapeHtml(resultText) : highlightJson(resultText)}</pre>
      </div>`;

    details.querySelector(".copy-btn").addEventListener("click", (e) => {
      e.stopPropagation();
      copyTextToClipboard(resultText, e.target);
    });
    messagesEl.appendChild(details);
    scrollToBottom();
  }

  function addThinkingEl(text) {
    hideEmptyState();
    const div = document.createElement("div");
    div.className = "thinking-line";
    div.textContent = text;
    messagesEl.appendChild(div);
    scrollToBottom();
    return div;
  }

  // ── Conversation ──
  async function sendMessage(userText) {
    if (!userText.trim()) return;
    if (isProcessing) {
      setStatus("⏳ 上一条任务仍在处理中，请等待完成…");
      if (thinkTimer) { thinkStart = Date.now(); updateThinking(); }
      return;
    }
    const [curProv, curModel] = modelBadge.dataset.active ? modelBadge.dataset.active.split("/") : [null, null];
    if (attachments.length && !modelSupportsVision(curProv, curModel)) {
      alert("当前模型不支持图片输入，附件将不会发送给 AI。建议切换到支持视觉的模型（Kimi K3 / GPT-5.6 / Claude Sonnet 5 / Gemini 3.7 Flash），或仅回复文本。");
    }
    isProcessing = true;
    sendBtn.disabled = true;
    setThinking("Thinking");

    conversation.push({ role: "user", content: buildUserMessageContent(userText) });
    addMessageEl("user", renderUserBubble(userText));
    if (attachments.length) clearAttachments();
    await saveHistoryEvent("user_message", {text_length: userText.length});

    try {
      await runConversationLoop();
    } catch (err) {
      console.error("[aifusion]", err);
      addMessageEl("assistant", `<span style="color:var(--error)">Error: ${escapeHtml(err.message)}</span>`);
    } finally {
      clearThinking();
      isProcessing = false;
      sendBtn.disabled = false;
      promptEl.focus();
    }
  }

  async function runConversationLoop() {
    const MAX_ROUNDS = 10;
    let verifyRounds = 0;
    const executedCalls = new Set();
    if (!Array.isArray(conversation) || conversation.length === 0) {
      throw new Error("当前会话上下文为空，未发送空请求。请重新输入本次 CAD 修改要求。");
    }
    for (let round = 0; round < MAX_ROUNDS; round++) {
      setThinking(`Thinking (第 ${round + 1}/${MAX_ROUNDS} 轮)`);
      // Read current provider/model from badge for each API call
      const [prov, model] = modelBadge.dataset.active
        ? modelBadge.dataset.active.split("/")
        : [null, null];

      const body = { messages: modelConversation() };
      if (prov) body.provider = prov;
      if (model) body.model = model;

      const response = await apiCall("POST", "/api/chat", body);
      const choice = response.choices?.[0];
      if (!choice) throw new Error("No response from AI");

      const msg = choice.message;

      // text response
      if (msg.content && !msg.tool_calls) {
        conversation.push({ role: "assistant", content: msg.content });
        addMessageEl("assistant", renderMarkdown(msg.content));
        await saveHistoryEvent("assistant_message", {has_tool_calls: false});
        return;
      }

      // tool calls
      if (msg.tool_calls && msg.tool_calls.length > 0) {
        conversation.push({ role: "assistant", content: msg.content || null, tool_calls: msg.tool_calls });

        for (const tc of msg.tool_calls) {
          const toolName = tc.function.name;
          let args;
          try { args = JSON.parse(tc.function.arguments || "{}"); } catch { args = {}; }

          const callFingerprint = `${toolName}:${JSON.stringify(args)}`;
          if (executedCalls.has(callFingerprint)) {
            const duplicate = {ok: false, tool: toolName, error: {code: "duplicate_tool_call", message: "The same tool call was already executed in this request; provide a different repair action."}};
            addToolCallEl(toolName, args, duplicate, true);
            conversation.push({role: "tool", tool_call_id: tc.id, name: toolName, content: JSON.stringify(duplicate)});
            continue;
          }
          executedCalls.add(callFingerprint);
          if (toolName === "execute" && args.featureType === "script" &&
              (typeof args.script !== "string" || !/def\s+run\s*\(\s*_context\s*\)/.test(args.script))) {
            const invalid = {ok: false, tool: toolName, error: {code: "invalid_script", message: "execute script must define def run(_context)."}};
            addToolCallEl(toolName, args, invalid, true);
            conversation.push({role: "tool", tool_call_id: tc.id, name: toolName, content: JSON.stringify(invalid)});
            continue;
          }
          if (toolName === "read" && args.queryType === "document" && !args.operation) {
            const invalid = {ok: false, tool: toolName, error: {code: "missing_operation", message: "read(document) requires operation: open, close, save, active, name, or path."}};
            addToolCallEl(toolName, args, invalid, true);
            conversation.push({role: "tool", tool_call_id: tc.id, name: toolName, content: JSON.stringify(invalid)});
            continue;
          }

          setThinking(`Running ${toolName}`);
          const thinkingEl = addThinkingEl(`Running ${toolName}...`);
          const toolStartedAt = Date.now();

          let result, isError = false;
          try { result = normalizeToolResult(toolName, await callFusionTool(toolName, args)); }
          catch (err) { result = `Error: ${err.message}`; isError = true; }

          isError = isError || result?.ok === false;

          thinkingEl.remove();
          addToolCallEl(toolName, args, result, isError, toolStartedAt);

          const shot = isScreenshotResult(result);
          conversation.push({
            role: "tool",
            tool_call_id: tc.id,
            name: toolName,
            // 截图 base64 不直接塞进 tool 消息(体积大且会污染纯文本模型), 仅保留摘要
            content: shot
              ? `[screenshot captured: ${result.mimeType}, base64 ${result.data.length} chars]`
              : (typeof result === "string" ? result : JSON.stringify(result)),
          });
          await saveHistoryEvent("tool_result", {tool: toolName, ok: !isError});

          // 视觉校验:截图结果 → 以带图 user 消息注入(仅视觉模型, 且限制轮数)
          if (shot && modelSupportsVision(prov, model) && visionCheckEnabled() &&
              verifyRounds < VISION_MAX_ROUNDS) {
            verifyRounds++;
            const shotDataUrl = await downscaleImageDataUrl(`data:${result.mimeType};base64,${result.data}`);
            pushVisionCheckMessage(shotDataUrl);
            addMessageEl("assistant", `<div class="vision-note">🔍 已获取设计截图，模型开始视觉校验（${verifyRounds}/${VISION_MAX_ROUNDS}）…</div>`);
          }
        }
        setThinking("Thinking");
        continue;
      }

      if (msg.content) {
        conversation.push({ role: "assistant", content: msg.content });
        addMessageEl("assistant", renderMarkdown(msg.content));
        await saveHistoryEvent("assistant_message", {has_tool_calls: false});
        return;
      }
      throw new Error("Empty response");
    }

    // max rounds
    if (!conversation.length) {
      throw new Error("CAD 会话上下文为空，无法生成总结。");
    }
    conversation.push({ role: "user", content: "Please summarize what you've done." });
    const final = await apiCall("POST", "/api/chat", { messages: modelConversation() });
    const c = final.choices?.[0]?.message?.content || "Done.";
    conversation.push({ role: "assistant", content: c });
    addMessageEl("assistant", renderMarkdown(c));
    await saveHistoryEvent("loop_limit_summary", {});
  }

  // ── Settings / Provider UI ──
  function getCurrProvider() { return document.getElementById("cfg-provider").value; }

  function updateModelSelect() {
    const pid = getCurrProvider();
    const sel  = document.getElementById("cfg-model");
    sel.innerHTML = "";

    const pmeta = providersMeta[pid];
    if (pmeta && pmeta.models) {
      const currentModel = window._currentModel || pmeta.models[0];
      pmeta.models.forEach(m => {
        const opt = document.createElement("option");
        opt.value = m; opt.textContent = m;
        if (m === currentModel) opt.selected = true;
        sel.appendChild(opt);
      });
    }
  }

  function updateProviderInfoRow() {
    const pid   = getCurrProvider();
    const pmeta = providersMeta[pid];
    const row   = document.getElementById("cfg-info");
    if (!pmeta) { row.innerHTML = ""; return; }

    const configured = pmeta.configured;
    const visionOK = modelSupportsVision(pid, document.getElementById("cfg-model").value || (pmeta.models || [])[0]) && visionCheckEnabled();
    row.innerHTML = `
      <span class="dot ${configured ? 'ok' : 'missing'}"></span>
      <span>${configured ? 'API key configured ✓' : 'No API key set — enter key below'}</span>
      ${visionOK ? '<span class="vision-badge">👁️ 支持视觉校验</span>'
                 : '<span class="vision-badge dim">视觉校验不可用（当前模型/开关）</span>'}
    `;
  }

  function updateApiKeyField() {
    const pid   = getCurrProvider();
    const pmeta = providersMeta[pid];
    const label = document.getElementById("cfg-apikey-label");
    const input = document.getElementById("cfg-apikey");
    const baseurl = document.getElementById("cfg-baseurl");

    if (pmeta) {
      label.textContent = `${pmeta.label} API Key`;
      input.placeholder = pid === "anthropic" ? "sk-ant-..." : pid === "google_gemini" ? "AIza..." : "sk-...";
      if (pmeta.base_url) baseurl.value = pmeta.base_url;
    }
  }

  async function loadSettings() {
    try {
      const cfg = await apiCall("GET", "/api/config");
      const modelsInfo = await apiCall("GET", "/api/models");
      providersMeta = modelsInfo.providers || {};

      window._currentModel = cfg.model || "";

      // Resolve default provider: config > auto-detected (sole configured) > hard-coded
      const defaultPid = cfg.provider || modelsInfo.default_provider || "deepseek";

      // Populate provider dropdown
      const provSel = document.getElementById("cfg-provider");
      provSel.innerHTML = "";
      Object.entries(providersMeta).forEach(([pid, pmeta]) => {
        const opt = document.createElement("option");
        opt.value = pid;
        opt.textContent = pmeta.label;
        if (pid === defaultPid) opt.selected = true;
        provSel.appendChild(opt);
      });

      updateModelSelect();
      updateProviderInfoRow();
      updateApiKeyField();

      // Load API key (from config for current provider)
      const pid = getCurrProvider();
      const pmeta = providersMeta[pid];
      if (pmeta) {
        const cfgKey = pmeta.config_key || `${pid}_api_key`;
        const savedKey = cfg[cfgKey] || "";
        // The server only returns a redacted marker. Keep it in the field so
        // saving a model change lets the server preserve the real key, but do
        // not treat it as a new credential in the browser.
        document.getElementById("cfg-apikey").value = savedKey;
        document.getElementById("cfg-apikey").placeholder = savedKey.startsWith("***")
          ? "已配置 API Key（无需重新输入）"
          : (pid === "anthropic" ? "sk-ant-..." : pid === "google_gemini" ? "AIza..." : "sk-...");
      }

      document.getElementById("cfg-system-prompt").value = cfg.system_prompt || "";

    } catch (e) {
      console.warn("[aifusion] Could not load settings:", e);
    }
  }

  async function saveSettings() {
    const pid     = getCurrProvider();
    const pmeta   = providersMeta[pid];
    const cfgKey  = pmeta ? (pmeta.config_key || `${pid}_api_key`) : `${pid}_api_key`;
    const model   = document.getElementById("cfg-model").value;

    const updates = {
      provider: pid,
      model: model,
      system_prompt: document.getElementById("cfg-system-prompt").value,
    };
    updates[cfgKey] = document.getElementById("cfg-apikey").value;
    updates[`${pid}_base_url`] = document.getElementById("cfg-baseurl").value;

    try {
      await apiCall("POST", "/api/config", updates);
      settingsEl.classList.remove("open");

      // Update badge
      const label = pmeta ? pmeta.label : pid;
      modelBadge.textContent = `⚙ ${label}/${model}`;
      modelBadge.dataset.active = `${pid}/${model}`;
      modelBadge.classList.toggle("configured", !!updates[cfgKey]);

      // Provider changes are part of the same resumable session; do not erase
      // the conversation as the previous implementation did.
      await saveHistoryEvent("settings_changed", {provider: pid, model});
    } catch (err) { alert("Failed to save: " + err.message); }
  }

  // ── Event handlers ──
  formEl.addEventListener("submit", e => {
    e.preventDefault();
    const text = promptEl.value.trim();
    if (!text || isProcessing) return;
    promptEl.value = "";
    promptEl.style.height = "auto";
    sendMessage(text);
  });

  promptEl.addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); formEl.dispatchEvent(new Event("submit")); }
  });
  promptEl.addEventListener("input", () => {
    promptEl.style.height = "auto";
    promptEl.style.height = Math.min(promptEl.scrollHeight, 120) + "px";
  });

  modelBadge.addEventListener("click", () => {
    settingsEl.classList.toggle("open");
    if (settingsEl.classList.contains("open")) loadSettings();
  });

  document.getElementById("cfg-provider").addEventListener("change", () => {
    updateModelSelect();
    updateProviderInfoRow();
    updateApiKeyField();
    // Reload config to show the right API key
    (async () => {
      try {
        const cfg = await apiCall("GET", "/api/config");
        const pid = getCurrProvider();
        const pmeta = providersMeta[pid];
        const cfgKey = pmeta ? (pmeta.config_key || `${pid}_api_key`) : `${pid}_api_key`;
        const savedKey = cfg[cfgKey] || "";
        document.getElementById("cfg-apikey").value = savedKey;
        document.getElementById("cfg-apikey").placeholder = savedKey.startsWith("***")
          ? "已配置 API Key（无需重新输入）"
          : "请输入 API Key";
      } catch {}
    })();
  });

  document.getElementById("settings-cancel").addEventListener("click", () => settingsEl.classList.remove("open"));
  document.getElementById("settings-save").addEventListener("click", saveSettings);

  // ── 清空会话:只清 UI 与内存对话,历史记录保留在本地数据库 ──
  document.getElementById("clear-btn").addEventListener("click", () => {
    if (isProcessing) { setStatus("⏳ 上一条任务仍在处理中，请等待完成…"); return; }
    conversation = [];
    messagesEl.querySelectorAll(".msg, .tool-call, .thinking-line").forEach(el => el.remove());
    if (emptyState) emptyState.style.display = "";
  });

  // ── 空状态示例:点击直接填入输入框 ──
  document.querySelectorAll(".empty-state .example").forEach(btn => {
    btn.addEventListener("click", () => {
      promptEl.value = btn.textContent.trim();
      promptEl.dispatchEvent(new Event("input"));
      promptEl.focus();
    });
  });

  document.getElementById("history-btn").addEventListener("click", async () => {
    const panel = document.getElementById("history-panel");
    panel.classList.toggle("open");
    settingsEl.classList.remove("open");
    if (panel.classList.contains("open")) await refreshHistory();
  });
  document.getElementById("history-project").addEventListener("change", async (e) => {
    historyProject = historyProjects.find(p => p.id === e.target.value);
    historyProject.sessions = (await apiCall("GET", `/api/projects/${historyProject.id}/sessions`)).sessions || [];
    historySession = historyProject.sessions[0] || null;
    renderHistorySelectors();
    if (historySession) await restoreHistory();
  });
  document.getElementById("history-session").addEventListener("change", (e) => {
    historySession = historyProject?.sessions.find(s => s.id === e.target.value) || null;
  });
  document.getElementById("history-restore").addEventListener("click", () => restoreHistory(true));
  document.getElementById("history-new-project").addEventListener("click", async () => {
    const name = prompt("项目名称", "Fusion design");
    if (!name) return;
    const created = await apiCall("POST", "/api/projects", {name});
    const session = (await apiCall("POST", `/api/projects/${created.project.id}/sessions`, {title: "Main design session"})).session;
    created.project.sessions = [session];
    historyProjects.unshift(created.project); historyProject = created.project; historySession = session;
    renderHistorySelectors(); conversation = []; messagesEl.querySelectorAll(".msg, .tool-call, .thinking-line").forEach(el => el.remove()); if (emptyState) emptyState.style.display = "";
  });
  document.getElementById("history-new-session").addEventListener("click", async () => {
    if (!historyProject) return;
    const session = (await apiCall("POST", `/api/projects/${historyProject.id}/sessions`, {title: `Design session ${new Date().toLocaleString()}`})).session;
    historyProject.sessions.unshift(session); historySession = session; renderHistorySelectors();
    conversation = []; messagesEl.querySelectorAll(".msg, .tool-call, .thinking-line").forEach(el => el.remove()); if (emptyState) emptyState.style.display = "";
  });

  // ── Init ──
  async function init() {
    try {
      // Restore vision-check toggle from localStorage
      const vc = document.getElementById("cfg-vision-check");
      if (vc) vc.checked = localStorage.getItem("aifusion_vision") !== "0";
      vc?.addEventListener("change", () => {
        localStorage.setItem("aifusion_vision", vc.checked ? "1" : "0");
        updateProviderInfoRow();
      });
      document.getElementById("cfg-model")?.addEventListener("change", () => updateProviderInfoRow());

      // Attachment controls
      document.getElementById("attach-btn")?.addEventListener("click", () => document.getElementById("attach-input")?.click());
      document.getElementById("attach-input")?.addEventListener("change", (e) => {
        handleAttachFiles(e.target.files);
        e.target.value = "";
      });

      const modelsInfo = await apiCall("GET", "/api/models");
      providersMeta = modelsInfo.providers || {};

      // Priority: config.stored_provider > auto-detected (sole configured) > hard-coded
      const defaultPid = modelsInfo.default_provider || "deepseek";
      const configuredCount = modelsInfo.configured_count || 0;

      // If only one provider has a key, auto-select it regardless of cfg.provider
      let pid;
      if (configuredCount === 1 && defaultPid) {
        pid = defaultPid;  // sole configured provider wins
      } else {
        pid = defaultPid;  // use whatever resolution gave us
      }

      const pmeta = providersMeta[pid] || {};
      const model = pmeta.models ? pmeta.models[0] : "";
      const label = pmeta.label || pid;
      const configured = pmeta.configured || false;

      modelBadge.textContent = configured
        ? `⚙ ${label}/${model}`
        : `⚙ ${configuredCount === 0 ? "No API key set" : label + "/" + model}`;
      modelBadge.dataset.active = `${pid}/${model}`;
      modelBadge.classList.toggle("configured", configured);
      // History is a workspace state: open it and restore the latest session
      // automatically whenever the Fusion Palette starts.
      document.getElementById("history-panel").classList.add("open");
      await refreshHistory();
    } catch (e) {
      console.warn("[aifusion] Init failed:", e);
    }
  }
  init();
})();
</script>
</body>
